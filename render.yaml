    name: gamervoice-signaling
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: SMTP_USER
        value: supportgamersvoice@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: RAZORPAY_KEY_ID
        value: rzp_live_SWhlEskNokZ9rR
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
